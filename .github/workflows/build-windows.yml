name: Build PostPilot Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-windows.yml'
      - 'src/**'
      - 'renderer/**'
      - 'preload.js'
      - 'main.js'
      - 'package*.json'

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout merged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Electron dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: renderer

      - name: Ensure Chromium is available for packaging
        run: npx puppeteer browsers install chrome

      - name: Build React frontend
        run: npm run build:ui

      - name: Configure bundled Chromium
        run: npm run prebuild:electron

      - name: Package Windows NSIS executable
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PostPilot-Windows-EXE
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
